<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduShare — Oflayn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #102C26;
      color: #F7E7Ce;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 400px; }
    .logo {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
    }
    .school { 
      font-size: 0.75rem; 
      letter-spacing: 0.5em; 
      opacity: 0.5;
      margin-bottom: 3rem;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    p { opacity: 0.7; line-height: 1.6; margin-bottom: 2rem; }
    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      border: 1px solid rgba(247,231,206,0.3);
      color: #F7E7Ce;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      font-family: inherit;
      transition: all 0.3s;
    }
    .btn:hover { background: rgba(247,231,206,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">EDUSHARE</div>
    <div class="school">SCHOOL</div>
    <div class="icon">📡</div>
    <h1>Internet bilan aloqa yo'q</h1>
    <p>Hozirda internetga ulanishingiz mavjud emas. Iltimos, tarmoqni tekshirib qaytadan urinib ko'ring.</p>
    <button class="btn" onclick="window.location.reload()">Qayta urinish →</button>
  </div>
</body>
</html>
