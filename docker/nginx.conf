# Nginx configuration for EduShare (Dockerized)

upstream edushare_app {
    server web:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name edushare.uz www.edushare.uz;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name edushare.uz www.edushare.uz;

    # Make sure certs are mapped to the container via Let's Encrypt volume
    ssl_certificate /etc/letsencrypt/live/edushare.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edushare.uz/privkey.pem;

    client_max_body_size 500M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    # === PERFORMANCE: Gzip Compression ===
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    # === PERFORMANCE: Buffer Optimization ===
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # React built assets + Django static files (merged by collectstatic / Dockerfile)
    location /static/ {
        alias /app/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /assets/ {
        alias /app/staticfiles/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        add_header Accept-Ranges bytes;
        expires 30d;
        access_log off;
    }

    # API, Admin, Django apps proxy to Django
    location ~ ^/(api|edushare-boshqaruv-2026|accounts|core|profile|courses|sitemap\.xml|robots\.txt) {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://edushare_app;
    }

    # Main application (React SPA served by Django BotRenderMiddleware)
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://edushare_app;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
