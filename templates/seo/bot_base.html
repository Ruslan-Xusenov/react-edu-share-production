<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% block head %}{% endblock %}
  <style>
    body{font-family:sans-serif;max-width:1100px;margin:0 auto;padding:1rem 1.5rem;color:#1a1a2e;background:#fff}
    h1{font-size:2rem;margin-bottom:.5rem}
    h2{font-size:1.4rem;color:#4a00e0}
    .card{border:1px solid #e0e0e0;border-radius:8px;padding:1rem;margin-bottom:1rem}
    .badge{background:#4a00e0;color:#fff;border-radius:4px;padding:2px 8px;font-size:.8rem}
    a{color:#4a00e0}
    nav a{margin-right:1rem}
    .stats{display:flex;gap:2rem;margin:1rem 0}
    .stat{text-align:center}
    .stat strong{display:block;font-size:2rem;color:#4a00e0}
    ul{padding-left:1.5rem}
    li{margin:.3rem 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
    footer{margin-top:3rem;padding-top:1rem;border-top:1px solid #eee;color:#888;font-size:.85rem}
  </style>
</head>
<body>
  <nav>
    <a href="/">EduShare</a>
    <a href="/courses">Kurslar</a>
    <a href="/community/news">Blog</a>
    <a href="/about">Haqimizda</a>
    <a href="/leaderboard">Reyting</a>
  </nav>
  {% block content %}{% endblock %}
  <footer>
    <p>© 2024 EduShare School — O'zbekistondagi bepul onlayn ta'lim platformasi. <a href="https://edushare.uz">edushare.uz</a></p>
  </footer>
</body>
</html>
